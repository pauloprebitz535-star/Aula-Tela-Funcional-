<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>

    <main class="window">

        <header class="window-header">
            <div class="window-dot red"></div>
            <div class="window-dot yellow"></div>
            <div class="window-dot green"></div>
        </header>

        <section class="content">

            <h1>Login</h1>
            <p class="subtitulo">Acesse sua conta</p>

            <form id="formLogin" novalidate>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="usuario@gmail.com" required>
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <div class="campo-senha">
                        <input type="password" id="senha" name="senha" placeholder="••••••••" required>
                        <button type="button" id="btnVerSenha" aria-label="Mostrar senha">👁</button>
                    </div>
                </div>

                <button type="submit" id="btnEntrar">ENTRAR</button>

            </form>

            <div id="mensagem" class="mensagem" role="status"></div>

        </section>

    </main>

    <script src="/static/js/login.js"></script>
</body>
</html>
